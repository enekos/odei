[package]
name = "odei"
version = "0.1.0"
edition = "2021"
description = "Tiny native coding agent for the terminal, powered by Kimi."
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.10", features = ["json"] }
rustyline = "14"
crossterm = "0.28"
globset = "0.4"
walkdir = "2"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
